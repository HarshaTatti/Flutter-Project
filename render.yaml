# Render Blueprint Configuration for Privacy-Preserving Chatbot
# Deploy as a Free Static Site with Global CDN & Client-Side SPA Routing

services:
  - type: web
    name: privacy-preserving-chatbot
    env: static
    plan: free
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    staticPublishPath: ./build/web
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /canvaskit/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA rewrite rule ensures refreshing /chat, /documents, /settings routes cleanly to index.html
      - type: rewrite
        source: /*
        destination: /index.html
